name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release assets
        run: make release-assets TAG="${GITHUB_REF_NAME}" OUTPUT_DIR=dist

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make publish-release TAG="${GITHUB_REF_NAME}" OUTPUT_DIR=dist

  publish-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check out tap repository
        uses: actions/checkout@v4
        with:
          repository: marble810/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/update-homebrew-formula.sh \
            "${GITHUB_REF_NAME}" \
            "$GITHUB_WORKSPACE/homebrew-tap"

      - name: Commit and push formula update
        working-directory: homebrew-tap
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No formula changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dpskmon.rb
          git commit -m "chore: publish dpskmon ${TAG}"
          git push origin HEAD:main
