name: publish-homebrew-tap

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check out tap repository
        uses: actions/checkout@v4
        with:
          repository: marble810/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/update-homebrew-formula.sh \
            "${{ github.event.release.tag_name }}" \
            "$GITHUB_WORKSPACE/homebrew-tap"

      - name: Commit and push formula update
        working-directory: homebrew-tap
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No formula changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dpskmon.rb
          git commit -m "chore: publish dpskmon ${TAG}"
          git push origin HEAD:main
